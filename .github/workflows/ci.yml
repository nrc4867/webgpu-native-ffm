name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Each platform loads its own natives jar and checks the library is the bundled release. No GPU is needed.
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew check
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports-${{ matrix.os }}
          path: |
            build/reports/tests
            build/test-results

  # Every jar a release publishes, built and published to Maven Local.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew nativesJars publishToMavenLocal
